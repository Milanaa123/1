name: Animagia import explicitly named Russian animal subspecies
on:
  workflow_dispatch:
  push:
    branches: [animagia-site]
    paths:
      - tools/import_tks_russian_subspecies.py
      - .github/workflows/animagia-tks-russian-subspecies.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve exact accepted subspecies with provenance
        run: python tools/import_tks_russian_subspecies.py
      - name: Commit sourced names
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add russian_tks_verified_subspecies.json
          git diff --cached --quiet && exit 0
          git commit -m "Import source-backed Russian names for exact accepted subspecies"
          git fetch origin animagia-site
          git rebase origin/animagia-site
          git push origin HEAD:animagia-site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: animagia-tks-russian-subspecies-dataset
          path: russian_tks_verified_subspecies.json
          if-no-files-found: ignore
