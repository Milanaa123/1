name: Animagia Vector Batch 11 Generator

on:
  push:
    branches: [animagia-site]
    paths:
      - 'tools/build_vector_batch11.py'
      - '.github/workflows/animagia-vector11-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install vector tracing dependencies
        run: python -m pip install --quiet 'numpy==1.26.4' 'Pillow==11.2.1' 'opencv-python-headless==4.11.0.86' 'CairoSVG==2.7.1'
      - name: Generate transparent SVG portraits 86–100 (except protected snake 87)
        run: python tools/build_vector_batch11.py
      - name: Verify fidelity on real Chromium Canvas
        run: node tests/check_vector_batch11.cjs
      - name: Verify hashes, transparency and all 14 SVG files
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          base=pathlib.Path('art/vector-ink')
          manifest=json.loads((base/'manifest-batch11.json').read_text())
          assert len(manifest['items'])==14
          assert manifest['preservedHandDrawn']['index']==87
          for i,e in zip([x for x in range(86,101) if x != 87],manifest['items']):
              assert e['index']==i
              data=(base/e['file']).read_bytes()
              assert len(data)==e['bytes']
              assert hashlib.sha256(data).hexdigest()==e['sha256']
              assert b'<path ' in data and b'<image' not in data
          print('VECTOR11_FILES_SHA256_VERIFIED')
          PY
      - name: Archive original versus traced SVG review sheet
        uses: actions/upload-artifact@v4
        with:
          name: animagia-vector11-original-versus-svg
          path: qa-artifacts/vector11-original-vs-svg.png
          retention-days: 14
      - name: Commit verified 14 drawings and site routing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add animal_atlas_100.js art/vector-ink/animal-086.svg art/vector-ink/animal-0{88..99}.svg art/vector-ink/animal-100.svg art/vector-ink/manifest-batch11.json
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Publish transparent gold vector animal drawings 86–100 (except protected snake 87)'
          git push origin HEAD:animagia-site
      - name: Archive browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: animagia-vector11-browser-proof
          path: qa-artifacts/vector11-chromium-14.png
          retention-days: 14
