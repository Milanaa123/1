name: Temporary Animagia artwork visual audit
on:
  push:
    branches: [animagia-visual-audit-20261028]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Render all 100 existing source sprites for close visual comparison
        run: |
          python -m pip install --disable-pip-version-check pillow
          cat > /tmp/art_audit.py <<'PY'
          import base64,io,json,re,textwrap
          from PIL import Image,ImageDraw,ImageFont
          from pathlib import Path
          src=Path('animal_atlas_100.js').read_text()
          names=[r[1] for r in json.loads(re.search(r'const entries=(\[.*?\]);',src).group(1))]
          im=Image.open('art/animagia-100-alpha.webp').convert('RGBA')
          print('ATLAS_SOURCE',im.size,'100_NAMES',len(names),'MODE',im.mode)
          try:
           f=ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf',16)
          except: f=ImageFont.load_default()
          totals=[]
          for i in range(100):
           cell=im.crop(((i%10)*160,(i//10)*110,(i%10+1)*160,(i//10+1)*110))
           alpha=cell.getchannel('A')
           nonzero=sum(1 for a in alpha.getdata() if a>24)
           edge=sum(1 for x in range(160) if alpha.getpixel((x,0))>24 or alpha.getpixel((x,109))>24)
           edge+=sum(1 for y in range(110) if alpha.getpixel((0,y))>24 or alpha.getpixel((159,y))>24)
           totals.append({'index':i+1,'name':names[i],'alpha':nonzero,'edge':edge,'bbox':alpha.getbbox()})
          print('ALPHA_SUMMARY',json.dumps({'min':min(x['alpha'] for x in totals),'max':max(x['alpha'] for x in totals),'empty':[x for x in totals if x['alpha']<150],'edgeRisk':[x for x in totals if x['edge']>12]},ensure_ascii=False))
          def emit(label,im):
           out=io.BytesIO();im.save(out,'WEBP',quality=76,method=5)
           Path('qa-artifacts').mkdir(exist_ok=True)
           Path('qa-artifacts/'+label+'.webp').write_bytes(out.getvalue())
           data=base64.b64encode(out.getvalue()).decode()
           print('ART_PREVIEW_BEGIN',label,'bytes',len(out.getvalue()),'chunks',len(textwrap.wrap(data,3000)))
           for i,chunk in enumerate(textwrap.wrap(data,3000)):print('ARTPREVIEW_'+label+'_'+str(i)+'='+chunk)
           print('ART_PREVIEW_END',label)
          for panel in range(4):
           board=Image.new('RGB',(5*340,5*280),(18,15,30));draw=ImageDraw.Draw(board)
           for k in range(25):
            idx=panel*25+k; sx=idx%10*160;sy=idx//10*110
            cell=im.crop((sx,sy,sx+160,sy+110))
            scaled=cell.resize((320,220),Image.Resampling.LANCZOS)
            bx=(k%5)*340+10;by=(k//5)*280+10
            board.paste(scaled,(bx,by),scaled)
            draw.text((bx+5,by+227),str(idx+1)+'. '+names[idx],font=f,fill=(238,202,155))
            draw.text((bx+5,by+251),'alpha='+str(totals[idx]['alpha'])+'  edge='+str(totals[idx]['edge']),font=f,fill=(164,161,183))
           emit('PANEL'+str(panel+1),board)
          approved=Image.open('art/animals-approved-01-05.png').convert('RGBA')
          bg=Image.new('RGB',(approved.width*2,approved.height*2),(18,15,30))
          resized=approved.resize(bg.size,Image.Resampling.NEAREST)
          bg.paste(resized,(0,0),resized)
          print('FIRST_FIVE_SEPARATE_PNG',approved.size,'alphaNonzero',sum(a>24 for a in approved.getchannel('A').getdata()))
          emit('FIRSTFIVE',bg)
          PY
          python /tmp/art_audit.py

      - name: Inspect actual cleaned browser Canvas for batches two through four
        run: |
          node tests/check_batch02_twenty.cjs
          node tests/check_batch03_twenty.cjs
          node tests/check_batch04_twenty.cjs
          python - <<'PY'
          import base64,io,textwrap
          from PIL import Image
          for batch in [2,3,4]:
           file=f'qa-artifacts/batch{batch:02d}-twenty-before-after.png'
           im=Image.open(file).convert('RGB')
           out=io.BytesIO()
           im.save(out,'WEBP',quality=80,method=5)
           data=base64.b64encode(out.getvalue()).decode()
           print('BROWSER_PREVIEW_BEGIN',batch,'original',im.size,'encoded_bytes',len(out.getvalue()))
           for i,chunk in enumerate(textwrap.wrap(data,3000)):print('BROWSERPREVIEW_'+str(batch)+'_'+str(i)+'='+chunk)
           print('BROWSER_PREVIEW_END',batch)
          PY
      - name: Publish visual audit of all 100 artworks and three cleaned batches
        uses: actions/upload-artifact@v4
        with:
          name: animagia-100-visual-tz-audit
          path: |
            qa-artifacts/PANEL*.webp
            qa-artifacts/FIRSTFIVE.webp
            qa-artifacts/batch02-twenty-before-after.png
            qa-artifacts/batch03-twenty-before-after.png
            qa-artifacts/batch04-twenty-before-after.png
          retention-days: 14
