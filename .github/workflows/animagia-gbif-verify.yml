name: Verify missing families against GBIF
on:
  push:
    branches: [animagia-site]
    paths:
      - '.github/workflows/animagia-gbif-verify.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: animagia-site
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover only exact high-confidence GBIF taxonomic families
        run: python tools/resolve_missing_gbif.py
      - name: Commit reviewed family matches and unresolved statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family_external_verified.json
          git commit -m "Store externally verified family identifiers for missing CoL taxa"
          git push origin HEAD:animagia-site
