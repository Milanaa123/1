name: Inspect missing source families and Russian name dataset
on:
  push:
    branches: [animagia-site]
    paths:
      - '.github/workflows/animagia-source-probe.yml'
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect existing missing-family report and open multilingual CSV
        run: |
          python - <<'PY'
          import urllib.request,json,csv,io,collections
          urls=[
            'https://animagia-calculator.onrender.com/families_missing.json',
            'https://birdnet.cornell.edu/taxonomy/api/download/csv'
          ]
          req=urllib.request.Request(urls[0],headers={'User-Agent':'Animagia-Data-Validation/1.0'})
          with urllib.request.urlopen(req,timeout=35) as resp:
            data=json.load(resp)
          print('MISSING_REPORT_TOTAL',data.get('count'),flush=True)
          print('MISSING_TOP_25',json.dumps(data.get('by_class_order',[])[:25]),flush=True)
          print('MISSING_EXAMPLES_20',json.dumps(data.get('examples',[])[:20]),flush=True)
          req=urllib.request.Request(urls[1],headers={'User-Agent':'Animagia-Data-Validation/1.0'})
          with urllib.request.urlopen(req,timeout=60) as resp:
            first=resp.read(7000).decode('utf-8-sig',errors='replace')
          reader=csv.reader(io.StringIO(first))
          header=next(reader)
          print('BIRDNET_COLS',json.dumps(header,ensure_ascii=False),flush=True)
          for j,row in enumerate(reader):
            if j>=2:break
            print('BIRDNET_EXAMPLE',json.dumps(row[:14],ensure_ascii=False),flush=True)
          PY
