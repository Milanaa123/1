name: Verify remaining families by exact genus in GBIF
on:
  push:
    branches: [animagia-site]
    paths: ['.github/workflows/animagia-gbif-genus.yml']
permissions:
  contents: write
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: animagia-site
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check only exact genus/rank and compatible classification
        run: python tools/resolve_missing_gbif_genus.py
      - name: Commit reviewed genus-family records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family_external_verified.json
          git commit -m "Add exact-genus family evidence for residual CoL taxa"
          git push origin HEAD:animagia-site
