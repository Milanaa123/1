name: Animagia import 125 original RGBA illustrations
on:
  push:
    branches: [animagia-site]
    paths:
      - .github/workflows/animagia-import-new-125.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  artwork:
    name: Verify user archives and publish original PNGs
    runs-on: ubuntu-24.04
    timeout-minutes: 38
