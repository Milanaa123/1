        run: |
          python3 - <<'PY'
          import pathlib,os,urllib.request
          directory=pathlib.Path('_incoming_animagia')
          directory.mkdir(exist_ok=True)
          files=["animagia_additions_91_portion_1.zip","animagia_additions_91_portion_2.zip","animagia_latest_original_png.zip","animagia_new_batch_02.zip","animagia_new_batch_03.zip","animagia_new_batch_04.zip","animagia_new_batch_05.zip","animagia_new_batch_06.zip","animagia_new_batch_07.zip","animagia_new_batch_08.zip","animagia_new_batch_09.zip","animagia_new_batch_10.zip","animagia_new_batch_11.zip","animagia_final_two_original_png.zip"]
          for number,name in enumerate(files):
              url=os.environ[f'ARCHIVE_URL_{number}']
              print('Downloading',number+1,'/',len(files),name,flush=True)
              with urllib.request.urlopen(url,timeout=180) as response:
                  with (directory/name).open('wb') as target:
                      while True:
                          buf=response.read(1024*1024)
                          if not buf:break
                          target.write(buf)
              print('Verified archive received', (directory/name).stat().st_size,flush=True)
          PY
      - name: Verify SHA-256 and import 125 exact species images
        run: python3 scripts/import_animagia_125.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: QA 400 original artwork and calculator
        run: |
          node --check new_art_125.js
          node --test tests/test-approved-only-art.cjs
          node --test tests/name_ancient_transliteration.test.cjs tests/nonart_stages.test.cjs tests/test_card_artifact.cjs
          python3 -m py_compile build_data.py selected_original_art.py
      - name: Commit verified art and mappings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/animagia-selected-107/ index.html build_data.py selected_original_art.py new_art_125.js tests/test-approved-only-art.cjs
          git commit -m "Publish verified 400 original animal artworks and exact mappings"
          git push origin HEAD:animagia-site
