name: Animagia feline redraws 06 10 candidates
on:
  push:
    branches: [animagia-site]
    paths: ['tools/build_redraw_cats_06_10.py','.github/workflows/animagia-redraw-cats.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Render original vector candidates
        run: |
          python -m pip install -q Pillow==11.3.0 CairoSVG==2.7.1
          python tools/build_redraw_cats_06_10.py
      - name: Keep unpublished vector proposals isolated
        run: |
          git diff --exit-code -- animal_atlas_100.js build_data.py art/vector-ink
          python - <<'PY'
          import json
          m=json.load(open('art/redraw-gold/manifest-proposals.json'))
          assert m['status']=='candidate-only'
          assert len(m['items'])==2 and all(not e['published'] for e in m['items'])
          print('REVIEW_NOT_PUBLISHED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: feline-new-art-before-approval
          path: qa-artifacts/redraw-cats-06-10-proposals.png
          retention-days: 14
      - name: Commit candidates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/redraw-gold/animal-006.svg art/redraw-gold/animal-010.svg art/redraw-gold/manifest-proposals.json qa-artifacts/redraw-cats-06-10-proposals.png
          git diff --cached --check
          git commit -m 'Create crisp original feline vector candidates for tiger and cougar'
          git push origin HEAD:animagia-site
