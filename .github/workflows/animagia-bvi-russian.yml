name: Validate published Russian zoological names from historical BVI index
on:
  push:
    branches: [animagia-site]
    paths:
      - 'tools/import_bvi_ru.py'
      - '.github/workflows/animagia-bvi-russian.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: animagia-site
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax and catalogue compatibility
        run: python -m py_compile tools/import_bvi_ru.py ru_catalog.py build_data.py
      - name: Import attested Russian names with original page evidence
        run: python tools/import_bvi_ru.py
      - name: Validate direct taxon-and-class matches
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from ru_catalog import BVI_SNAPSHOT,bvi_ru_label
          x=json.loads(Path('russian_bvi_snapshot.json').read_text(encoding='utf-8'))
          assert x['count']==BVI_SNAPSHOT['count'] and x['count']>1000
          assert x['stats']['pages_read']>=40
          for key,entry in list(x['names'].items())[:2000]:
              latin,rank=key.split('|')
              russian,classes,url=entry
              assert bvi_ru_label(latin,classes[0],rank)==russian
              assert bvi_ru_label(latin,'IncorrectClass',rank)==''
          print('BVI_RUSSIAN_TAXON_MATCH_AUDIT_PASSED',x['count'])
          PY
      - name: Commit attested Russian names and citations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add russian_bvi_snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add cited historical published Russian zoological names'
            git push origin HEAD:animagia-site
          fi
