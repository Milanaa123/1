name: Animagia 41–60 visual evidence gallery
on:
  push:
    branches: [animagia-site]
    paths:
      - 'tools/render_audit_gallery_41_60.py'
      - '.github/workflows/animagia-gallery-41-60.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SVG renderer
        run: python -m pip install --quiet 'Pillow==11.3.0' 'CairoSVG==2.7.1'
      - name: Check source-accurate audit first
        run: node tests/check_review_batch03.cjs
      - name: Render every live-routed 41–60 SVG, label each animal
        run: python tools/render_audit_gallery_41_60.py
      - name: Archive picture gallery
        uses: actions/upload-artifact@v4
        with:
          name: animagia-41-60-visual-audit
          path: qa-artifacts/animal-audit-41-60.png
          retention-days: 14
      - name: Commit verified gallery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa-artifacts/animal-audit-41-60.png
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Archive actual 41–60 SVG artwork and visual review labels'
          git push origin HEAD:animagia-site
