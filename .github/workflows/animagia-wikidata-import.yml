name: Import Wikidata Russian species labels with exact scientific names
on:
  push:
    branches: [animagia-site]
    paths: ['tools/import_wikidata_names.py','.github/workflows/animagia-wikidata-import.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: animagia-site
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select exact non-Latin Russian labels for Wikidata species
        run: python tools/import_wikidata_names.py
      - name: Commit provenance and names
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add russian_wikidata_snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "Import Wikidata Russian vernacular species labels"
            git push origin HEAD:animagia-site
          fi
