name: Animagia four redraw candidates 24 33 51 52
on:
  push:
    branches: [animagia-site]
    paths: ['tools/build_redraw_four.py','.github/workflows/animagia-redraw-four.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Create new anatomy-based vector drawings
        run: |
          python -m pip install -q Pillow==11.3.0 CairoSVG==2.7.1
          python tools/build_redraw_four.py
      - name: Validate no live drawings are changed by candidate creation
        run: |
          git diff --exit-code -- animal_atlas_100.js build_data.py art/vector-ink
          python - <<'PY'
          import json
          m=json.load(open('art/redraw-gold/manifest-proposals-4.json'))
          assert m['status']=='candidate-only'
          assert [x['index'] for x in m['items']]==[24,33,51,52]
          assert all(not x['published'] for x in m['items'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: redraw-crow-roe-rabbit-hare-review
          path: qa-artifacts/redraw-crow-deer-rabbit-hare-proposals.png
          retention-days: 14
      - name: Commit candidate drawings for review
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/redraw-gold/animal-024.svg art/redraw-gold/animal-033.svg art/redraw-gold/animal-051.svg art/redraw-gold/animal-052.svg art/redraw-gold/manifest-proposals-4.json qa-artifacts/redraw-crow-deer-rabbit-hare-proposals.png
          git diff --cached --check
          git commit -m 'Add new original vector candidates for crow roe deer rabbit and hare'
          git push origin HEAD:animagia-site
