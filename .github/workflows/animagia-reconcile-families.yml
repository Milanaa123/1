name: Animagia reconcile missing taxonomy with iNaturalist and WoRMS
on:
  workflow_dispatch:
  push:
    branches: [animagia-site]
    paths:
      - tools/reconcile_missing_families.py
      - .github/workflows/animagia-reconcile-families.yml
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strictly compare live unresolved taxa with independent authorities
        run: python tools/reconcile_missing_families.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: animagia-missing-families-reviewed
          path: qa-artifacts/unresolved-family-20261030
          if-no-files-found: ignore
