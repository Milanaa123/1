name: Animagia site artwork and calculator validation
on:
  push:
    branches: [animagia-site]
  pull_request:
    branches: [animagia-site]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax of website scripts
        run: |
          for file in greek_weights_reference.js app.js ru_name_lookup.js greek_taxa.js enhancements.js photo_gallery.js animal_atlas.js selected_art_107.js selected_art_400.js new_art_167.js new_art_125.js representative_art.js approved_only_cards.js approved_only_cards_400.js approved_chooser_gallery.js relic_features.js; do node --check "$file"; done
      - name: Verify exact photo-only TOP-30, category order and insect cap
        run: node --test tests/photo-gallery.test.cjs
      - name: Verify polished single-list UI and clean real-photo gallery
        run: node --test tests/test-final-ui-polish.cjs
      - name: Verify varied illustrated bestiary selection and PDF page geometry
        run: node --test tests/test-bestiary-diversity.cjs
      - name: Verify 400 source PNG checksums and exclusive card rendering
        run: node --test tests/test-approved-only-art.cjs
      - name: Verify representative drawings are honestly labeled and taxonomically restricted
        run: node --test tests/test-representative-art.cjs
      - name: Verify original fish, bird and mammal drawings never cross numbered asset batches
        run: python -m unittest discover -s tests -p 'test_artwork_source_collision.py' -v
      - name: Check Python catalogue builder syntax
        run: python -m py_compile build_data.py audit_index.py ru_catalog.py artwork_representatives_builder.py
      - name: Validate family and Russian-name fields without changing Greek sums
        run: python -m unittest discover -s tests -p 'test_quality.py' -v
      - name: Check exact-species Russian name lookup with mocked API
        run: node tests/test_ru_name_lookup.cjs
      - name: Verify static build includes Russian name lookup
        run: grep -F "shutil.copy2(BASE/'ru_name_lookup.js',DEST/'ru_name_lookup.js')" build_data.py
      - name: Verify the Greek alphabet values against every methodical letter
        run: node --test tests/test_methodical_greek_values.cjs
      - name: Verify the exact Latin-name to Ancient-Greek letter transliteration
        run: node --test tests/name_ancient_transliteration.test.cjs
      - name: Verify animal name calculator remains unchanged
        run: node --test tests/phonetic.test.cjs tests/strict-original.test.cjs
      - name: Verify non-artwork stages (scientific labels, ecology, exports and mobile containment)
        run: node --test tests/nonart_stages.test.cjs
      - name: Verify mobile keyboard and performance regressions
        run: node --test tests/test_mobile_performance.cjs
