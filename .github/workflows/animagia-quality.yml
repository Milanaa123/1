name: Animagia scientific and arithmetic QA
on:
  push:
    branches: [animagia-site]
  pull_request:
    branches: [animagia-site]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: |
          for file in app.js greek_taxa.js enhancements.js photo_gallery.js magic_ui.js ritual_ui.js silhouette_service.js animal_atlas.js animal_atlas_100.js relic_features.js; do
            node --check "$file"
          done
      - name: Verify LIVE Render serves final batch six, animals 86–100
        run: |
          set -euo pipefail
          url="https://animagia-calculator.onrender.com"
          echo "LIVE_RENDER_BASE=$url"
          echo "LIVE_HTML_HTTP=$(curl --silent --show-error --location --max-time 55 --retry 1 --write-out '%{http_code}' "$url/" -o /tmp/animagia-live.html)"
          echo "LIVE_JS_HTTP=$(curl --silent --show-error --location --max-time 45 --retry 1 --write-out '%{http_code}' "$url/animal_atlas_100.js" -o /tmp/animagia-live.js)"
          echo "LIVE_WEBP_HTTP=$(curl --silent --show-error --location --max-time 45 --retry 1 --write-out '%{http_code}' "$url/art/animagia-100-alpha.webp" -o /tmp/animagia-live.webp)"
          echo "LIVE_HTML_BYTES=$(wc -c </tmp/animagia-live.html)"
          echo "LIVE_JS_BYTES=$(wc -c </tmp/animagia-live.js)"
          echo "LIVE_WEBP_BYTES=$(wc -c </tmp/animagia-live.webp)"
          corrected_code=$(curl --fail --silent --show-error --location --max-time 45 --write-out '%{http_code}' "$url/art/animagia-corrected-22.webp" -o /tmp/animagia-live-corrected.webp)
          echo "LIVE_CORRECTED_HTTP=$corrected_code"
          for art in animagia-100-sharp4x.webp animagia-corrected-22-sharp4x.webp animals-approved-01-05-sharp4x.png; do
            curl --fail --silent --show-error --location --max-time 55 "$url/art/$art" -o "/tmp/$art"
            test "$(wc -c <"/tmp/$art")" -gt 100000
          done
          python - <<'PY'
          import json,hashlib
          meta=json.load(open('art/sharp-art-manifest.json'))
          for entry in meta['results']:
           data=open('/tmp/'+entry['file'],'rb').read()
           assert len(data)==entry['bytes'] and hashlib.sha256(data).hexdigest()==entry['sha256'],entry['file']
          print('LIVE_SHARP_ALL_100_ART_BYTES_VERIFIED')
          PY
          snake_http=$(curl --fail --silent --show-error --location --max-time 45 --write-out '%{http_code}' "$url/art/animagia-grass-snake-87.svg" -o /tmp/animagia-live-snake87.svg)
          echo "LIVE_GRASS_SNAKE_87_HTTP=$snake_http"
          test "$snake_http" = 200
          echo '31a6276434eef7f5a5593f94885fcc40b36cc096e03f0b59f82369571dfaa216  /tmp/animagia-live-snake87.svg' | sha256sum --check
          for n in animal-006.webp animal-009.webp animal-087.webp animal-100.webp approved-01.webp; do
            curl --fail --silent --show-error --location --max-time 40 "$url/art/individual-4x/$n" -o "/tmp/$n"
          done
          python - <<'PY'
          import json,hashlib
          items=json.load(open('art/individual-4x/manifest.json'))['items']
          verified=0
          for entry in items:
           f=entry['file']
           if f in ('animal-006.webp','animal-009.webp','animal-087.webp','animal-100.webp','approved-01.webp'):
            assert hashlib.sha256(open('/tmp/'+f,'rb').read()).hexdigest()==entry['sha256'],f
            verified+=1
          assert verified==5
          print('LIVE_INDIVIDUAL_ART_5_EXAMPLES_VERIFIED')
          PY
          test "$(wc -c </tmp/animagia-live-corrected.webp)" -gt 60000
          echo "LIVE_HTML_ATLAS_REFERENCES:"
          grep -oE 'animal_atlas_100\\.js[^"<> ]*' /tmp/animagia-live.html | head -5 || true
          echo "LIVE_JS_BATCH_MARKERS:"
          grep -oE 'batch0[23456]:\\{first:[0-9]+,last:[0-9]+,count:[0-9]+' /tmp/animagia-live.js | sort -u || true
          echo "LIVE_HTML_START:"
          head -c 180 /tmp/animagia-live.html | tr '\\n' ' '
          echo
          echo "LIVE_JS_START:"
          head -c 120 /tmp/animagia-live.js | tr '\\n' ' '
          echo
          expected_atlas_version=$(grep -oE 'animal_atlas_100\\.js\\?v=[a-zA-Z0-9-]+' index.html | head -1)
          test -n "$expected_atlas_version"
          grep -Fq "$expected_atlas_version" /tmp/animagia-live.html || { echo 'RENDER_OLD_HTML_OR_WRONG_SITE'; exit 1; }
          grep -Fq 'batch06:{first:86,last:100,count:15' /tmp/animagia-live.js || { echo 'RENDER_OLD_JS_OR_WRONG_SITE'; exit 1; }
          test "$(wc -c </tmp/animagia-live.webp)" -gt 20000
          test "$(dd if=/tmp/animagia-live.webp bs=1 count=4 2>/dev/null)" = 'RIFF'
          for n in animal-006.svg animal-015.svg animal-025.svg; do
            curl --fail --silent --show-error --location --max-time 45 "$url/art/vector-ink/$n" -o "/tmp/$n"
          done
          python - <<'PY'
          import json,hashlib
          entries=json.load(open('art/vector-ink/manifest.json'))['items']
          matches=0
          for e in entries:
           if e['file'] in ('animal-006.svg','animal-015.svg','animal-025.svg'):
            data=open('/tmp/'+e['file'],'rb').read()
            assert len(data)==e['bytes'] and hashlib.sha256(data).hexdigest()==e['sha256'],e['file']
            assert b'<path' in data and b'<image' not in data
            matches+=1
          assert matches==3
          print('LIVE_VECTOR_20_SVG_BATCH_VERIFIED')
          PY
          echo "LIVE_RENDER_CURRENT_BATCH06_CONFIRMED"
      - name: Verify 20 gold SVG outlines on real Chromium Canvas
        run: node tests/check_vector_batch07.cjs
      - name: Save 20 SVG portraits from live Chromium
        uses: actions/upload-artifact@v4
        with:
          name: animagia-vector07-20-browser-proof
          path: qa-artifacts/vector07-chromium-20.png
          retention-days: 14
      - name: Check per-animal loading avoids downloading the 10MB source atlases
        run: node tests/check_individual_art.cjs
      - name: Save focused, sharp on-demand browser proof
        uses: actions/upload-artifact@v4
        with:
          name: animagia-on-demand-art-preview
          path: qa-artifacts/on-demand-artwork.png
          retention-days: 14
      - name: Verify sharper 4× illustrations in actual Chromium at card size
        run: node tests/check_sharp_art.cjs
      - name: Save sharp art comparison in browser
        uses: actions/upload-artifact@v4
        with:
          name: animagia-sharp-all100-4x-before-after
          path: qa-artifacts/sharp-art-before-after.png
          retention-days: 14
      - name: Test the full 100-image atlas and representative taxonomy without network
        run: node --test tests/test_atlas100.cjs
      - name: Inspect all 100 transparent images in real Chromium
        run: node tests/check_atlas100.cjs
      - name: Check next 20 artist-approved animals on actual Chromium Canvas
        run: node tests/check_batch02_twenty.cjs
      - name: Check third batch of 20 original animal drawings in real Chromium
        run: node tests/check_batch03_twenty.cjs
      - name: Check fourth batch of 20 original animal drawings in real Chromium
        run: node tests/check_batch04_twenty.cjs
      - name: Check fifth batch of 20 animal drawings in real Chromium
        run: node tests/check_batch05_twenty.cjs
      - name: Verify gold grass snake 87 artwork on Chromium Canvas
        run: node tests/check_snake87.cjs
      - name: Publish grass snake 87 artwork before and after
        uses: actions/upload-artifact@v4
        with:
          name: animagia-grass-snake87-before-after
          path: qa-artifacts/grass-snake87-before-after.png
          retention-days: 14
      - name: Check final 15 biological/fantasy figures in Chromium
        run: node tests/check_batch06_fifteen.cjs
      - name: Save last 15 drawings before-and-after proof
        uses: actions/upload-artifact@v4
        with:
          name: animagia-batch06-last15-before-after
          path: qa-artifacts/batch06-twenty-before-after.png
          retention-days: 14
      - name: Save fifth batch before-and-after transparent art proof
        uses: actions/upload-artifact@v4
        with:
          name: animagia-batch05-20-before-after
          path: qa-artifacts/batch05-twenty-before-after.png
          retention-days: 14
      - name: Verify 22 anatomical corrections on real browser Canvas
        run: node tests/check_corrected_species.cjs
      - name: Save 22 corrected drawings with original comparisons
        uses: actions/upload-artifact@v4
        with:
          name: animagia-corrected-22-visual-proof
          path: qa-artifacts/corrected-22-in-browser.png
          retention-days: 14
      - name: Save batch four original/cleaned image pairs
        uses: actions/upload-artifact@v4
        with:
          name: animagia-batch04-20-before-after
          path: qa-artifacts/batch04-twenty-before-after.png
          retention-days: 14
      - name: Save batch three original/cleaned image pairs
        uses: actions/upload-artifact@v4
        with:
          name: animagia-batch03-20-before-after
          path: qa-artifacts/batch03-twenty-before-after.png
          retention-days: 14
      - name: Save 20 originals and cleaned transparent sprites side by side
        uses: actions/upload-artifact@v4
        with:
          name: animagia-batch02-twenty-species-visual-proof
          path: qa-artifacts/batch02-twenty-before-after.png
          retention-days: 14
      - name: Publish 100-image transparency montage
        uses: actions/upload-artifact@v4
        with:
          name: animagia-100-transparent-animals
          path: qa-artifacts/atlas100-browser.png
          retention-days: 14
      - name: Validate silhouette matching and image licenses without external network
        run: node --test tests/test_silhouette.mjs
      - name: Verify first-five overrides and remaining 95 in complete browser atlas
        run: node tests/check_complete_animal_stack.cjs
      - name: Save combined first-batch and 100-art browser proof
        uses: actions/upload-artifact@v4
        with:
          name: animagia-first-five-plus-full-100-art-proof
          path: qa-artifacts/combined-100-and-reviewed-five.png
          retention-days: 14
      - name: Check five real first-batch cards use the exact approved atlas sprites
        run: node tests/check_batch1_integration.cjs
      - name: Publish screenshot of five selected species on actual card pipeline
        uses: actions/upload-artifact@v4
        with:
          name: animagia-batch1-five-live-card-pipeline
          path: qa-artifacts/batch01-integrated-cards.png
          retention-days: 14
      - name: Verify transparent originals from first five user-approved animal drawings
        run: node tests/check_batch1_original_art.cjs
      - name: Publish real-browser first batch preview
        uses: actions/upload-artifact@v4
        with:
          name: animagia-approved-originals-batch01
          path: qa-artifacts/batch01-animals.png
          retention-days: 14
      - name: Check curated animal artwork, genus accuracy and habitats
        run: node --test tests/test_animal_atlas.cjs
      - name: Regression test responsive animal chooser and premium PNG
        run: node --test tests/test_premium_card.cjs
      - name: Validate antique collectible-card design and shared PNG background
        run: node --test tests/test_card_artifact.cjs
      - name: Validate all 100 approved visual subjects
        run: node --test tests/test_animal_vibes.cjs
      - name: Check stage-one card base in real Chromium
        run: node tests/check_stage1_template.cjs
      - name: Publish stage-one visual proof
        uses: actions/upload-artifact@v4
        with:
          name: animagia-stage1-gold-template
          path: qa-artifacts/stage1-card-base.png
          retention-days: 14
      - name: Capture all ten animal frame families for visual acceptance
        run: node tests/check_stage3_frame_preview.cjs
      - name: Publish stage-three border-family visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: animagia-stage3-ten-frame-families
          path: qa-artifacts/stage3-ten-frame-families.png
          retention-days: 14
      - name: Real-browser Canvas pixel QA for diet-frame cutouts
        run: node tests/check_frame_pixels.cjs
      - name: Check Greek owner seal in Chromium for short and long names
        run: node tests/check_stage2_seal.cjs
      - name: Save owner-name wheel visual proof
        uses: actions/upload-artifact@v4
        with:
          name: animagia-stage2-greek-name-wheel
          path: qa-artifacts/stage2-greek-wheels.png
          retention-days: 14
      - name: Fetch actual approved gold frog art for browser inspection
        run: |
          mkdir -p qa-artifacts
          curl --fail --location --retry 2 --retry-delay 2 --max-time 100 --silent --show-error "https://animagia-calculator.onrender.com/art/animals-gold-v1.png" --output qa-artifacts/animals-gold-v1.png
          test "$(stat -c%s qa-artifacts/animals-gold-v1.png)" -gt 50000
      - name: Verify corrected frog muzzle and nostril in real Chromium
        run: node tests/check_stage4_frog.cjs
      - name: Publish stage-four frog artwork visual inspection
        uses: actions/upload-artifact@v4
        with:
          name: animagia-stage4-frog-nose-and-full-silhouette
          path: qa-artifacts/stage4-frog-nose.png
          retention-days: 14
      - name: Run deterministic Python-JavaScript equivalence tests
        run: python -m unittest discover -s tests -v
