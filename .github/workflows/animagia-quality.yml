name: Animagia site artwork and calculator validation
on:
  push:
    branches: [animagia-site]
  pull_request:
    branches: [animagia-site]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax of website scripts
        run: |
          for file in app.js greek_taxa.js enhancements.js animal_atlas.js animal_atlas_100.js animal_cutout_40.js gold_contour_40.js gold_contour_41_60.js gold_contour_61_80.js gold_contour_81_100.js relic_features.js; do node --check "$file"; done
      - name: Validate unchanged reference source and all 100 routed vector originals
        run: node tests/check_exact_reference_01_40.cjs
      - name: Verify 100 paths draw on Canvas and have no empty vector slots
        run: node tests/check_gold_contour_runtime.cjs
      - name: Validate family and Russian-name fields without changing Greek sums
        run: python -m unittest discover -s tests -p 'test_quality.py' -v
      - name: Verify animal name calculator remains unchanged
        run: node --test tests/phonetic.test.cjs tests/strict-original.test.cjs
