name: Animagia six species-specific redraws preliminary visual review
on:
  push:
    branches: [animagia-site]
    paths:
      - 'art/redraw-gold/manifest-batch02-candidates.json'
      - '.github/workflows/animagia-redraw-batch02-review.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate preserved prior site routing and six new files
        run: node tests/check_redraw_batch02_candidates.cjs
      - name: Render SVG six-figure proof
        run: |
          pip install -q CairoSVG==2.7.1 Pillow==11.3.0
          python tools/render_redraw_batch02_preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: animagia-redraw-53-54-55-60-63-65-preview
          path: qa-artifacts/redraw-batch02-preview.png
          retention-days: 14
      - name: Archive reviewed 6 SVG preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa-artifacts/redraw-batch02-preview.png
          git diff --cached --check
          git commit -m 'Archive six new original animal vector candidates before site approval'
          git push origin HEAD:animagia-site
