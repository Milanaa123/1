name: Animagia free GitHub Pages mirror (Russia)
on:
  workflow_dispatch:
  push:
    branches: [animagia-site]
    paths:
      - .github/workflows/animagia-free-pages.yml
      - build_data.py
      - artwork_representatives_builder.py
      - app.js
      - index.html
      - magic_theme.css
      - relic_features.js
      - bestiary_pdf.js
      - enhancements.js
      - photo_gallery.js
      - original/**
      - art/**
      - '*.js'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: animagia-free-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.repository == 'Milanaa123/1'
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Checkout canonical artwork and source (no image recompression)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up free GitHub Pages (requires Pages enabled for the repository)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the exact public Animagia site
        run: |
          python3 build_data.py > /tmp/animagia-pages-build.log 2>&1 || { tail -n 70 /tmp/animagia-pages-build.log; exit 1; }
          tail -n 5 /tmp/animagia-pages-build.log | cut -c1-350
          touch public/.nojekyll
          test -f public/index.html
          test -f public/data/53.json
          test -f public/art/animagia-original-400/manifest.json
      - name: Prove 400 original images and full published catalogue
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('public')
          files=[p for p in root.rglob('*') if p.is_file()]
          size=sum(p.stat().st_size for p in files)
          assert size<1_000_000_000, f'Exceeds free GitHub Pages 1 GB limit: {size}'
          manifest=json.loads((root/'art/animagia-original-400/manifest.json').read_text())
          meta=json.loads((root/'meta.json').read_text())
          assert manifest['count']==400
          assert meta['quality_audit']['status']=='passed'
          assert meta['quality_audit']['checked_records']==1193864
          assert meta['representative_artwork']['class_level_guarantee']
          for item in manifest['files']:
              blob=(root/'art/animagia-original-400'/item['file']).read_bytes()
              assert blob.startswith(bytes.fromhex('89504e470d0a1a0a'))
              assert hashlib.sha256(blob).hexdigest()==item['sha256']
          print('ANIMAGIA_GITHUB_PAGES_SIZE',size,'FILES',len(files),'ARTWORKS',manifest['count'])
          PY
      - name: Upload GitHub Pages static artifact without PNG modifications
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
          retention-days: 1
      - name: Deploy alternate free URL
        id: pages
        uses: actions/deploy-pages@v4
