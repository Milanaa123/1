name: Translation API Test
on:
  push:
    paths:
      - '.github/workflows/translation-api-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probe viable LibreTranslate mirrors
        shell: bash
        run: |
          set +e
          payload='{"q":"Hey Shane. I need to talk to you.","source":"en","target":"ru","format":"text"}'
          for spec in \
            'normal|https://libretranslate.de' \
            'insecure|https://trans.zillyhuhn.com' \
            'normal|https://translate.flossboxin.org.in' \
            'normal|https://libretranslate.esmailelbob.xyz' \
            'normal|https://libretranslate.pussthecat.org' \
            'normal|https://lt.psf.lt'; do
            mode=${spec%%|*}; host=${spec#*|}
            echo "===== $host ====="
            extra=''
            [ "$mode" = insecure ] && extra='-k'
            curl $extra -sSL --max-time 30 -w '\nHTTP=%{http_code}\n' -X POST "$host/translate" \
              -H 'Content-Type: application/json' -d "$payload" 2>&1 | head -c 2000
            echo
          done
          exit 0
