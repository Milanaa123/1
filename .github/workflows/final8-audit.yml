name: Final 8 Direct Links
on:
  push:
    paths:
      - '.github/workflows/final8-audit.yml'
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Get temporary Nexus links
        run: |
          set -e
          for id in 10675 31537 27161 18176 19091 37926 30294 9972 33571 20653; do
            echo "MOD=$id"
            curl -fsSL "https://nexus-loader.onrender.com/api/nexusFileLink?game=stardewvalley&modId=$id"
            echo
          done
