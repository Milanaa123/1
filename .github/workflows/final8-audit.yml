name: Final 6 Encrypted Sources
on:
  push:
    paths:
      - '.github/workflows/final8-audit.yml'
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact archives and extract JSON
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/downloads work/extracted work/jsonsrc
          cat > work/public.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAkNeAaEqUXvfbsvFuxy8f
          pEsQRtSQld29STaouVFFSKsaYa3b1Vb4D25FoW7mgQEU2lbfXsW8tw11PFwfKVyV
          jeZk8/fEF7KuJBZ6qGtkiaedLI1fVsc549gH9LVRKDJ2Qdood2w0pDgcfnJFVB0v
          eGyXzuK7+IeeTiJFJJX6mfX+HzlK3TVd7SJTLvwR4nfkxiTG3J2LriL0lCFWjLyg
          2kt/z8ZDMjjsSAH/kz9eqncVXa4sSvcqLhj5PdDzga+6IOXBE0ZtCfhsMqnwFJvO
          Upy13XeVKx3PfJfGM20A3DOhahsfvGquX/d8gcVx8tP6Wsgzbwb7AbdUu9EbqF+1
          WwIDAQAB
          -----END PUBLIC KEY-----
          EOF
          specs=(
            '10675:129882:168_dynamic'
            '31537:137300:300_maggs'
            '19091:120932:498_trinkets'
            '37926:164272:502_clowning'
            '30294:124322:505_winterstar_rsv'
            '9972:46468:530_farmerjack'
            '20653:82995:498_trinkets_ru'
          )
          for spec in "${specs[@]}"; do
            IFS=: read -r mod file label <<< "$spec"
            echo "fetch $label mod=$mod file=$file"
            ok=0
            for attempt in $(seq 1 24); do
              code=$(curl -sS -o work/link.json -w '%{http_code}' "https://nexus-loader.onrender.com/api/nexusFileLink?game=stardewvalley&modId=$mod&fileId=$file" || true)
              if [ "$code" = "200" ] && [ "$(jq -r '.chosen.file_id // 0' work/link.json)" = "$file" ]; then ok=1; break; fi
              sleep 5
            done
            [ "$ok" = 1 ] || { cat work/link.json; exit 1; }
            url=$(jq -r .url work/link.json)
            url=${url// /%20}
            curl -fL --retry 3 --retry-delay 2 "$url" -o "work/downloads/$label.arc"
            mkdir -p "work/extracted/$label"
            7z x -y "work/downloads/$label.arc" -o"work/extracted/$label" >/dev/null
            python - "$label" <<'PY'
          import os,sys,shutil
          label=sys.argv[1]
          src=os.path.join('work','extracted',label)
          dst=os.path.join('work','jsonsrc',label)
          count=0
          for root,dirs,files in os.walk(src):
              for fn in files:
                  if not fn.lower().endswith(('.json','.jsonc')): continue
                  p=os.path.join(root,fn)
                  rel=os.path.relpath(p,src)
                  out=os.path.join(dst,rel)
                  os.makedirs(os.path.dirname(out),exist_ok=True)
                  shutil.copy2(p,out); count+=1
          print(label,'json_files',count)
          PY
          done
          tar -C work -czf work/source-json.tgz jsonsrc
          openssl rand 48 > work/keyiv.bin
          KEY=$(dd if=work/keyiv.bin bs=1 count=32 2>/dev/null | xxd -p -c 256)
          IV=$(dd if=work/keyiv.bin bs=1 skip=32 count=16 2>/dev/null | xxd -p -c 256)
          openssl enc -aes-256-cbc -K "$KEY" -iv "$IV" -in work/source-json.tgz -out work/source-json.enc
          openssl pkeyutl -encrypt -pubin -inkey work/public.pem -pkeyopt rsa_padding_mode:oaep -in work/keyiv.bin -out work/keyiv.enc
          rm -rf work/downloads work/extracted work/jsonsrc work/source-json.tgz work/keyiv.bin work/public.pem work/link.json
      - name: Upload encrypted sources
        uses: actions/upload-artifact@v4
        with:
          name: final6-encrypted-json
          path: |
            work/source-json.enc
            work/keyiv.enc
          retention-days: 1
          compression-level: 0
