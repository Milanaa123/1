name: Independent QA for animals 26–45 SVG vectors
on:
  push:
    branches: [animagia-vector-batch08-20261028]
    paths:
      - 'animal_atlas_100.js'
      - 'build_data.py'
      - 'tests/check_vector_batch08.cjs'
      - 'tests/test_atlas100.cjs'
      - '.github/workflows/animagia-vector-batch08-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser script syntax
        run: |
          node --check animal_atlas_100.js
          node --check tests/check_vector_batch07.cjs
          node --check tests/check_vector_batch08.cjs
      - name: Test actual 40 vector paths and Greek naming invariant
        run: node --test tests/test_atlas100.cjs
      - name: Check first twenty real SVG paths 6–25 in Chromium
        run: node tests/check_vector_batch07.cjs
      - name: Check second twenty real SVG paths 26–45 in Chromium
        run: node tests/check_vector_batch08.cjs
      - name: Regression-test all 100 animal portraits and five originals
        run: node tests/check_individual_all100.cjs
      - name: Preserve 22 previous anatomical corrections
        run: node tests/check_corrected_species.cjs
      - name: Preserve exported card and old figure layouts
        run: node tests/check_complete_animal_stack.cjs
      - name: Save 20 updated vector species in browser
        uses: actions/upload-artifact@v4
        with:
          name: animagia-vector08-twenty-browser-proof
          path: qa-artifacts/vector08-chromium-20.png
          retention-days: 14
