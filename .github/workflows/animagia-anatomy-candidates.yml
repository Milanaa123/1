name: Prepare animal anatomy corrections 06 and 10 (review only)
on:
  push:
    branches: [animagia-site]
    paths:
      - 'tools/propose_felids_06_10.py'
      - '.github/workflows/animagia-anatomy-candidates.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install raster and vector inspection dependencies
        run: python -m pip install -q 'Pillow==11.3.0' 'numpy==1.26.4' 'opencv-python-headless==4.11.0.86' 'CairoSVG==2.7.1'
      - name: Generate side-by-side candidate proof from original reference atlas
        run: python tools/propose_felids_06_10.py
      - name: Confirm original site files are untouched
        run: |
          git diff --exit-code -- animal_atlas_100.js art/vector-ink/ art/individual-4x/
          node tests/check_review_batch01.cjs
      - name: Archive visual comparison
        uses: actions/upload-artifact@v4
        with:
          name: animagia-felid-candidates-06-10
          path: qa-artifacts/original-cat-proposals-06-10.png
          retention-days: 14
      - name: Save proposals in isolated review directory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/candidates/animal-006-original-proposal.svg art/candidates/animal-010-original-proposal.svg art/candidates/manifest-06-10.json qa-artifacts/original-cat-proposals-06-10.png
          git diff --cached --check
          git commit -m 'Add isolated original-atlas replacement proposals for tiger and puma'
          git push origin HEAD:animagia-site
