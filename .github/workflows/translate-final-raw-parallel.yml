name: Parallel Final Raw 3
on:
  push:
    paths: ['.github/workflows/translate-final-raw-parallel.yml']
jobs:
  translate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: dynamic
            mod: 10675
            file: 129882
          - label: trinkets
            mod: 19091
            file: 120932
          - label: farmerjack
            mod: 9972
            file: 46468
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install
        run: |
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --quiet 'transformers>=4.45,<5' sentencepiece sacremoses json5
      - name: Download exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p x out
          for i in $(seq 1 24); do
            c=$(curl -sS -o l.json -w '%{http_code}' "https://nexus-loader.onrender.com/api/nexusFileLink?game=stardewvalley&modId=${{ matrix.mod }}&fileId=${{ matrix.file }}" || true)
            [ "$c" = 200 ] && [ "$(jq -r '.chosen.file_id//0' l.json)" = "${{ matrix.file }}" ] && break
            sleep 5
          done
          u=$(jq -r .url l.json); u=${u// /%20}
          curl -fL --retry 3 "$u" -o src.arc
          7z x -y src.arc -ox >/dev/null
      - name: Translate selected text and validate
        env:
          LABEL: ${{ matrix.label }}
        run: |
          cat > t.py <<'PY'
          import os,re,json,pathlib,json5,copy
          from transformers import MarianMTModel,MarianTokenizer
          label=os.environ['LABEL']
          N='Helsinki-NLP/opus-mt-en-ru'; tk=MarianTokenizer.from_pretrained(N); md=MarianMTModel.from_pretrained(N)
          TOKEN=re.compile(r'(\{\{[^{}]+\}\}|#\$[A-Za-z0-9_]+#|\$[A-Za-z0-9_]+|@[A-Za-z0-9_.-]*|%[A-Za-z0-9_.-]+|\[[^\[\]]+\]|\^[^^\s]*)'); LAT=re.compile(r'[A-Za-z]{2,}'); QUOTE=re.compile(r'"((?:\\.|[^"\\])*)"')
          fixes={'Stardew Valley':'Долина Стардью','Pelican Town':'Пеликан Таун','Ridgeside Village':'деревня Риджсайд','Zuzu City':'Зузу-Сити','Winter Star':'Зимняя звезда','Feast of the Winter Star':'Праздник Зимней звезды','Adventurers Guild':'Гильдия искателей приключений','Junimo':'Джунимо','Yoba':'Йоба','Krobus':'Кробус','Dwarf':'Дварф','Shane':'Шейн','Sterling':'Стерлинг','Marnie':'Марни','Jas':'Джас','Pierre':'Пьер','Emily':'Эмили','Abigail':'Эбигейл','Alex':'Алекс','Caroline':'Кэролайн','Clint':'Клинт','Demetrius':'Деметриус','Elliott':'Эллиот','Evelyn':'Эвелин','George':'Джордж','Gus':'Гас','Haley':'Хейли','Harvey':'Харви','Jodi':'Джоди','Kent':'Кент','Lewis':'Льюис','Maru':'Мару','Penny':'Пенни','Robin':'Робин','Sam':'Сэм','Sebastian':'Себастьян','Vincent':'Винсент','Willy':'Вилли','Leah':'Лия','Pam':'Пэм','Linus':'Линус','Wizard':'Волшебник','Sandy':'Сэнди','Leo':'Лео'}
          cm={'a':'а','b':'б','c':'к','d':'д','e':'е','f':'ф','g':'г','h':'х','i':'и','j':'дж','k':'к','l':'л','m':'м','n':'н','o':'о','p':'п','q':'к','r':'р','s':'с','t':'т','u':'у','v':'в','w':'в','x':'кс','y':'й','z':'з'}
          def translit(w):
              z=''.join(cm.get(c.lower(),c) for c in w); return z.capitalize() if w[:1].isupper() else z
          def load(p): return json5.loads(p.read_text('utf-8-sig'))
          seg=[]; seen=set()
          def collect(s):
              for q in TOKEN.split(s):
                  if not q or TOKEN.fullmatch(q): continue
                  q=q.strip()
                  if LAT.search(q) and q not in seen: seen.add(q); seg.append(q)
          root=next(pathlib.Path('x').glob('**/[Cc]ontent.json')).parent
          docs=[]
          if label=='farmerjack':
              p=next(root.glob('[Cc]ontent.json')); o=load(p); docs=[('content.json',o,'entries')]
              for ch in o.get('Changes',[]):
                  for v in (ch.get('Entries') or {}).values():
                      if isinstance(v,str): collect(v)
          elif label=='dynamic':
              for rel in ['Content.json','Data/ConversationTopics.json','Data/Mail.json']:
                  p=root/rel
                  if p.exists():
                      o=load(p); docs.append((rel,o,'entries'))
                      for ch in o.get('Changes',[]):
                          for v in (ch.get('Entries') or {}).values():
                              if isinstance(v,str): collect(v)
              for p in list((root/'Data/EventData').glob('*.json'))+list((root/'Assets/Events').glob('*.json')):
                  o=load(p); docs.append((str(p.relative_to(root)),o,'event'))
                  for ch in o.get('Changes',[]):
                      for v in (ch.get('Entries') or {}).values():
                          if isinstance(v,str):
                              for m in QUOTE.finditer(v): collect(m.group(1))
          else:
              c=load(root/'content.json'); e=load(root/'events.json'); m=load(root/'mail.json'); docs=[('content.json',c,'display'),('events.json',e,'event'),('mail.json',m,'entries')]
              def walk(x):
                  if isinstance(x,dict):
                      for k,v in x.items():
                          if k in ('DisplayName','Description') and isinstance(v,str): collect(v)
                          else: walk(v)
                  elif isinstance(x,list):
                      for v in x: walk(v)
              walk(c)
              for ch in e.get('Changes',[]):
                  for v in (ch.get('Entries') or {}).values():
                      if isinstance(v,str):
                          for mm in QUOTE.finditer(v): collect(mm.group(1))
              for ch in m.get('Changes',[]):
                  for v in (ch.get('Entries') or {}).values():
                      if isinstance(v,str): collect(v)
          pieces=[]; owner={}
          for s in seg:
              if len(tk(s).input_ids)<=400: ps=[s]
              else:
                  ps=[]; cur=[]
                  for w in s.split():
                      z=' '.join(cur+[w])
                      if cur and len(tk(z).input_ids)>360: ps.append(' '.join(cur)); cur=[w]
                      else: cur.append(w)
                  if cur: ps.append(' '.join(cur))
              owner[s]=ps; pieces+=ps
          tr={}
          for i in range(0,len(pieces),32):
              b=pieces[i:i+32]; enc=tk(b,return_tensors='pt',padding=True,truncation=False); gen=md.generate(**enc,max_new_tokens=512,num_beams=1); dec=tk.batch_decode(gen,skip_special_tokens=True); tr.update(zip(b,dec)); print(label,i+len(b),'/',len(pieces),flush=True)
          cache={}
          for s,ps in owner.items():
              r=' '.join(tr[p] for p in ps)
              for a,b in fixes.items(): r=re.sub(rf'\b{re.escape(a)}\b',b,r,flags=re.I)
              cache[s]=LAT.sub(lambda m:translit(m.group(0)),r)
          def cv(s):
              out=[]
              for q in TOKEN.split(s):
                  if not q: continue
                  if TOKEN.fullmatch(q): out.append(q); continue
                  mm=re.match(r'^(\s*)(.*?)(\s*)$',q,flags=re.S); a,b,c=mm.groups(); out.append(a+cache.get(b,b)+c)
              return ''.join(out)
          def ev(s): return QUOTE.sub(lambda m:'"'+cv(m.group(1)).replace('"','\\"')+'"',s)
          report={'label':label,'files':0,'translatedValues':0,'residualLatin':0}
          out=pathlib.Path('out')
          def residual_text(s): return bool(LAT.search(TOKEN.sub('',s)))
          def patch_display(x):
              if isinstance(x,dict):
                  for k,v in list(x.items()):
                      if k in ('DisplayName','Description') and isinstance(v,str): x[k]=cv(v); report['translatedValues']+=1; report['residualLatin']+=int(residual_text(x[k]))
                      else: patch_display(v)
              elif isinstance(x,list):
                  for v in x: patch_display(v)
          for rel,o,mode in docs:
              oo=copy.deepcopy(o)
              if mode=='display': patch_display(oo)
              else:
                  for ch in oo.get('Changes',[]):
                      ent=ch.get('Entries') if isinstance(ch,dict) else None
                      if not isinstance(ent,dict): continue
                      for k,v in list(ent.items()):
                          if not isinstance(v,str): continue
                          nv=ev(v) if mode=='event' else cv(v); ent[k]=nv; report['translatedValues']+=1
                          if mode=='event':
                              for m in QUOTE.finditer(nv): report['residualLatin']+=int(residual_text(m.group(1)))
                          else: report['residualLatin']+=int(residual_text(nv))
              dst=out/rel; dst.parent.mkdir(parents=True,exist_ok=True); dst.write_text(json.dumps(oo,ensure_ascii=False,indent=2)+'\n','utf8'); report['files']+=1
          # farmerjack config labels are also visible in GMCM
          if label=='farmerjack':
              cfg={}; src=docs[0][1]
              names={'farmerjack_Abigail_Dialogue':'Диалоги Эбигейл','farmerjack_Elliott_Dialogue':'Диалоги Эллиота','farmerjack_Emily_Dialogue':'Диалоги Эмили','farmerjack_Haley_Dialogue':'Диалоги Хейли','farmerjack_Harvey_Dialogue':'Диалоги Харви','farmerjack_Leah_Dialogue':'Диалоги Лии','farmerjack_Penny_Dialogue':'Диалоги Пенни','farmerjack_Shane_Dialogue':'Диалоги Шейна','farmerjack_Maru_Dialogue':'Диалоги Мару','farmerjack_Alex_Dialogue':'Диалоги Алекса'}
              for k in (src.get('ConfigSchema') or {}): cfg[f'config.{k}.name']=names.get(k,'Диалоги персонажа')
              (out/'i18n').mkdir(exist_ok=True); (out/'i18n/ru.json').write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n','utf8'); report['files']+=1
          (out/'TRANSLATION_REPORT.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),'utf8'); print(json.dumps(report,ensure_ascii=False),flush=True)
          if report['residualLatin']: raise SystemExit('residual Latin found')
          PY
          python t.py
      - uses: actions/upload-artifact@v4
        with:
          name: final-${{ matrix.label }}-raw-overlay
          path: out/
          retention-days: 1
