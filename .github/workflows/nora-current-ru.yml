name: Nora RU 2.9.2
on:
  push:
    paths:
      - '.github/workflows/nora-current-ru.yml'
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download and extract current Russian release
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://stardewmods.ru/uploads/public_files/2026-02/herpetologist.7z' -o nora.7z
          echo "bytes=$(stat -c%s nora.7z)"
          file nora.7z
          mkdir -p extracted final
          7z x -y nora.7z -oextracted >/dev/null
          find extracted -type f -iname 'ru.json' -print
          mapfile -t RUFILES < <(find extracted -type f -path '*/i18n/ru.json')
          test "${#RUFILES[@]}" -ge 1
          cp "${RUFILES[0]}" final/ru.json
          python - <<'PY'
          import json,re,pathlib
          p=pathlib.Path('final/ru.json')
          raw=p.read_text('utf-8-sig')
          data=json.loads(raw)
          assert isinstance(data,dict) and len(data)>100
          assert any(re.search('[А-Яа-яЁё]',str(v)) for v in data.values())
          print('keys',len(data),'bytes',p.stat().st_size)
          PY
      - name: Upload Nora Russian i18n
        uses: actions/upload-artifact@v4
        with:
          name: nora-ru-2.9.2-final
          path: final/ru.json
          retention-days: 1
          compression-level: 6
