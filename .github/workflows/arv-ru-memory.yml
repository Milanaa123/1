name: ARV RU Memory
on:
  push:
    paths:
      - '.github/workflows/arv-ru-memory.yml'
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download ARV original and RU translation
        run: |
          set -euo pipefail
          mkdir -p orig ru out/en out/ru
          for spec in '9999:orig' '11114:ru'; do
            IFS=: read -r mod label <<< "$spec"
            for i in $(seq 1 20); do
              curl -fsSL "https://nexus-loader.onrender.com/api/nexusFileLink?game=stardewvalley&modId=$mod" -o link.json || true
              url=$(jq -r '.url // empty' link.json)
              [ -n "$url" ] && break
              sleep 5
            done
            test -n "$url"
            url=${url// /%20}
            curl -fL --retry 3 "$url" -o "$label.arc"
            7z x -y "$label.arc" -o"$label" >/dev/null
          done
          python - <<'PY'
          import pathlib,shutil
          rels=['Data/ConversationTopics.json','Data/EventData/SterlingEvents.json','Data/Mail.json','Data/TriggerActions.json','content.json']
          for side in ('orig','ru'):
              files=list(pathlib.Path(side).rglob('*.json'))
              for rel in rels:
                  hits=[p for p in files if p.as_posix().endswith('/[CP] Always Raining in the Valley/'+rel)]
                  if not hits:
                      hits=[p for p in files if p.as_posix().endswith('/Always Raining in the Valley/'+rel)]
                  if hits:
                      out=pathlib.Path('out','en' if side=='orig' else 'ru',rel)
                      out.parent.mkdir(parents=True,exist_ok=True)
                      shutil.copy2(hits[0],out)
                      print(side,rel,'->',hits[0])
          print('EN',len(list(pathlib.Path('out/en').rglob('*.json'))),'RU',len(list(pathlib.Path('out/ru').rglob('*.json'))))
          PY
          test "$(find out/en -type f | wc -l)" -ge 4
          test "$(find out/ru -type f | wc -l)" -ge 3
      - uses: actions/upload-artifact@v4
        with:
          name: arv-ru-paired-json
          path: out/
          retention-days: 1
