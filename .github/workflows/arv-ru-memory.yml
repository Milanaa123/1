name: ARV RU Memory
on:
  push:
    paths:
      - '.github/workflows/arv-ru-memory.yml'
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download ARV original and RU translation
        run: |
          set -euo pipefail
          mkdir -p orig ru out
          for spec in '9999:orig' '11114:ru'; do
            IFS=: read -r mod label <<< "$spec"
            for i in $(seq 1 20); do
              curl -fsSL "https://nexus-loader.onrender.com/api/nexusFileLink?game=stardewvalley&modId=$mod" -o link.json || true
              url=$(jq -r '.url // empty' link.json)
              [ -n "$url" ] && break
              sleep 5
            done
            test -n "$url"
            url=${url// /%20}
            curl -fL --retry 3 "$url" -o "$label.arc"
            7z x -y "$label.arc" -o"$label" >/dev/null
          done
          echo '--- ORIGINAL I18N ---'
          find orig -type f -iname '*.json' | sort | head -80
          echo '--- RU JSON ---'
          find ru -type f -iname '*.json' | sort | head -120
          cp "$(find orig -type f -path '*/i18n/default.json' | head -1)" out/default.json
          RUF=$(find ru -type f \( -iname 'ru.json' -o -iname 'ru-RU.json' -o -iname '*russian*.json' \) | head -1)
          if [ -z "$RUF" ]; then
            RUF=$(python - <<'PY'
          import pathlib,re
          best=None
          for p in pathlib.Path('ru').rglob('*.json'):
              s=p.read_text('utf-8-sig',errors='ignore')
              score=len(re.findall('[А-Яа-яЁё]',s))
              if score and (best is None or score>best[0]): best=(score,str(p))
          print(best[1] if best else '')
          PY
          )
          fi
          echo "RUF=$RUF"
          test -n "$RUF"
          cp "$RUF" out/ru.json
          python - <<'PY'
          import json,pathlib,re
          def strip(s):
              s=re.sub(r'/\*.*?\*/','',s,flags=re.S)
              s=re.sub(r'(^|\s)//.*',r'\1',s)
              s=re.sub(r',\s*([}\]])',r'\1',s)
              return s
          d=json.loads(strip(pathlib.Path('out/default.json').read_text('utf-8-sig')))
          r=json.loads(strip(pathlib.Path('out/ru.json').read_text('utf-8-sig')))
          print('default',len(d),'ru',len(r),'common',len(set(d)&set(r)))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arv-ru-memory
          path: out/
          retention-days: 1
