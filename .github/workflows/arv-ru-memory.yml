name: ARV RU Memory
on:
  push:
    paths:
      - '.github/workflows/arv-ru-memory.yml'
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download ARV original and RU translation
        run: |
          set -euo pipefail
          mkdir -p orig ru out/en out/ru
          for spec in '9999:orig' '11114:ru'; do
            IFS=: read -r mod label <<< "$spec"
            for i in $(seq 1 20); do
              curl -fsSL "https://nexus-loader.onrender.com/api/nexusFileLink?game=stardewvalley&modId=$mod" -o link.json || true
              url=$(jq -r '.url // empty' link.json)
              [ -n "$url" ] && break
              sleep 5
            done
            test -n "$url"
            url=${url// /%20}
            curl -fL --retry 3 "$url" -o "$label.arc"
            7z x -y "$label.arc" -o"$label" >/dev/null
          done
          OROOT="$(find orig -type d -path '*/[CP] Always Raining in the Valley' | head -1)"
          RROOT="$(find ru -type d -path '*/[CP] Always Raining in the Valley' | head -1)"
          echo "OROOT=$OROOT"
          echo "RROOT=$RROOT"
          test -d "$OROOT" && test -d "$RROOT"
          for rel in \
            'Data/ConversationTopics.json' \
            'Data/EventData/SterlingEvents.json' \
            'Data/Mail.json' \
            'Data/TriggerActions.json' \
            'content.json'; do
            if [ -f "$OROOT/$rel" ]; then mkdir -p "out/en/$(dirname "$rel")"; cp "$OROOT/$rel" "out/en/$rel"; fi
            if [ -f "$RROOT/$rel" ]; then mkdir -p "out/ru/$(dirname "$rel")"; cp "$RROOT/$rel" "out/ru/$rel"; fi
          done
          find out -type f -printf '%P %s\n' | sort
          python - <<'PY'
          import pathlib
          for side in ('en','ru'):
              print(side, len(list(pathlib.Path('out',side).rglob('*.json'))),'json files')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arv-ru-paired-json
          path: out/
          retention-days: 1
