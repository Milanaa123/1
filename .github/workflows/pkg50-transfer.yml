name: Package 50 Transfer

on:
  push:
    paths:
      - '.github/workflows/pkg50-transfer.yml'

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified package
        run: |
          curl -fL --retry 3 --retry-delay 2 'https://tmpfiles.org/dl/wFwQBaQ6JY9l/pkg50.zip' -o pkg50.zip
          test "$(stat -c%s pkg50.zip)" = "319317"
          echo '956066b8ac54eec3cf55622fb1de0393949c78768e1db43ca6c46f40582d2e14  pkg50.zip' | sha256sum -c -
          unzip -t pkg50.zip
      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg50-bundle
          path: pkg50.zip
          retention-days: 1
