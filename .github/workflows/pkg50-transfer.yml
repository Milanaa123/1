name: Package 50 Transfer

on:
  push:
    paths:
      - '.github/workflows/pkg50-transfer.yml'

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified package
        run: |
          curl -fsSL --retry 3 --retry-delay 2 'https://nexus-loader.onrender.com/api/pkg50bundle?status=1' -o status.json
          cat status.json
          grep -q '"ok":true' status.json
          curl -fL --retry 3 --retry-delay 2 'https://nexus-loader.onrender.com/api/pkg50bundle' -o pkg50.zip
          test "$(stat -c%s pkg50.zip)" = "319317"
          sha256sum pkg50.zip
          unzip -t pkg50.zip
      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg50-bundle
          path: pkg50.zip
          retention-days: 1
