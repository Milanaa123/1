name: Animagia source-verify real Russian family names
on:
  workflow_dispatch:
  push:
    branches: [animagia-site]
    paths:
      - tools/review_wikidata_families.py
      - .github/workflows/animagia-wikidata-family-review.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/review_wikidata_families.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: animagia-reviewed-russian-family-names
          path: qa-artifacts/russian-family-wikidata/
          if-no-files-found: ignore
