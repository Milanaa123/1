name: Animagia source-verify real Russian family names
on:
  workflow_dispatch:
  push:
    branches: [animagia-site]
    paths:
      - tools/review_wikidata_families.py
      - tools/publish_verified_families.py
      - .github/workflows/animagia-wikidata-family-review.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/review_wikidata_families.py
      - name: Publish strict reviewed family snapshot
        run: python tools/publish_verified_families.py
      - name: Commit review results to site branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family_ru_wikidata_verified.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import source-verified Russian animal family names from Wikidata"
          git fetch origin animagia-site
          git rebase origin/animagia-site
          git push origin HEAD:animagia-site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: animagia-reviewed-russian-family-names
          path: qa-artifacts/russian-family-wikidata/
          if-no-files-found: ignore
