name: Probe Wikidata Russian taxon names
on:
  push:
    branches: [animagia-site]
    paths: ['tools/probe_wikidata_taxa.py','.github/workflows/animagia-wikidata-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/probe_wikidata_taxa.py
