name: Verify unresolved families with Open Tree of Life
on:
  push:
    branches: [animagia-site]
    paths: ['tools/resolve_missing_opentree.py','.github/workflows/animagia-opentree-verify.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: animagia-site
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact taxonomy and matching hierarchy
        run: python tools/resolve_missing_opentree.py
      - name: Commit only independent verified evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family_opentree_verified.json
          if ! git diff --cached --quiet; then
            git commit -m "Record OpenTree independently verified missing families"
            git push origin HEAD:animagia-site
          fi
