name: Probe ITIS family hierarchy for residual unclassified taxa
on:
  push:
    branches: [animagia-site]
    paths: ['.github/workflows/animagia-itis-probe.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect independent ITIS taxonomic hierarchy without assigning unverified families
        run: |
          python - <<'PY'
          import json,urllib.parse,urllib.request
          names=['Buddelundiella sporadica','Creteus cyrina','Lepidostoma inaequalis','Triga fusca','Dactylosoma piperis','Eimeria psittacarae']
          for name in names:
            params={'q':'nameWInd:"'+name+'"','wt':'json','rows':'3','fl':'nameWInd,usage,rank,kingdom,hierarchySoFarWRanks'}
            url='https://services.itis.gov/?'+urllib.parse.urlencode(params)
            try:
              request=urllib.request.Request(url,headers={'User-Agent':'Animagia-Taxonomy-Check/1.0'})
              with urllib.request.urlopen(request,timeout=20) as r:obj=json.load(r)
              print('ITIS_PROBE',name,json.dumps(obj.get('response',{}),ensure_ascii=False)[:1700],flush=True)
            except Exception as e: print('ITIS_ERROR',name,str(e),flush=True)
          PY
