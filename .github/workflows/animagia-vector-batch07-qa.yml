name: Verify scalable SVG portraits for 20 animals in real Chromium
on:
  push:
    branches: [animagia-vector-batch07-20261028]
    paths:
      - 'tests/check_vector_batch07.cjs'
      - 'tests/test_atlas100.cjs'
      - 'animal_atlas_100.js'
      - 'build_data.py'
      - '.github/workflows/animagia-vector-batch07-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check SVG-related client syntax
        run: |
          node --check animal_atlas_100.js
          node --check tests/check_vector_batch07.cjs
      - name: Verify 20 SVG hashes, scientific routing and Greek arithmetic invariants
        run: node --test tests/test_atlas100.cjs
      - name: Compare 20 actual SVGs to reference artwork in Chromium
        run: node tests/check_vector_batch07.cjs
      - name: Regression-test all 100 cards and five personally approved originals
        run: node tests/check_individual_all100.cjs
      - name: Preserve previous 22 anatomical corrections
        run: node tests/check_corrected_species.cjs
      - name: Save actual in-browser vector artwork proof
        uses: actions/upload-artifact@v4
        with:
          name: animagia-batch07-svg-20-browser-proof
          path: qa-artifacts/vector07-chromium-20.png
          retention-days: 14
