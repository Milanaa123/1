name: Probe GBIF family for missing CoL taxon
on:
  push:
    branches: [animagia-site]
    paths: ['.github/workflows/animagia-gbif-probe.yml']
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check exact taxonomic family matches for unclassified taxa
        run: |
          python - <<'PY'
          import json,urllib.parse,urllib.request
          u='https://animagia-calculator.onrender.com/families_missing.json'
          with urllib.request.urlopen(u,timeout=30) as r:
            report=json.load(r)
          print('UNRESOLVED',report['count'],'SAMPLES',len(report['examples']),flush=True)
          for row in report['examples'][:12]:
            params={'name':row['scientific_name'],'rank':row['rank'].upper(),
                    'kingdom':'Animalia','class':row['class'],'strict':'true'}
            if row['order']:params['order']=row['order']
            url='https://api.gbif.org/v1/species/match?'+urllib.parse.urlencode(params)
            try:
              with urllib.request.urlopen(url,timeout=15) as r: data=json.load(r)
              view={k:data.get(k) for k in ['canonicalName','matchType','confidence','status','rank','kingdom','phylum','class','order','family','synonym']}
              print('GBIF_MATCH',row['scientific_name'],json.dumps(view),flush=True)
            except Exception as ex:print('GBIF_FAILED',row['scientific_name'],str(ex),flush=True)
          PY
