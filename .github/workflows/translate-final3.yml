name: Translate Final 3 i18n Mods
on:
  push:
    paths:
      - '.github/workflows/translate-final3.yml'
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install translation runtime
        run: |
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --quiet 'transformers>=4.45,<5' sentencepiece sacremoses json5
      - name: Download exact mod archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads extracted out
          for spec in '31537:137300:maggs' '37926:164272:clowning' '30294:124322:uws_rsv'; do
            IFS=: read -r mod file label <<< "$spec"
            ok=0
            for attempt in $(seq 1 24); do
              code=$(curl -sS -o link.json -w '%{http_code}' "https://nexus-loader.onrender.com/api/nexusFileLink?game=stardewvalley&modId=$mod&fileId=$file" || true)
              if [ "$code" = 200 ] && [ "$(jq -r '.chosen.file_id // 0' link.json)" = "$file" ]; then ok=1; break; fi
              sleep 5
            done
            [ "$ok" = 1 ] || exit 1
            url=$(jq -r .url link.json); url=${url// /%20}
            curl -fL --retry 3 "$url" -o "downloads/$label.arc"
            mkdir -p "extracted/$label"; 7z x -y "downloads/$label.arc" -o"extracted/$label" >/dev/null
          done
      - name: Translate and validate dictionaries in batches
        run: |
          cat > translate.py <<'PY'
          import re,json,pathlib,json5
          from transformers import MarianMTModel, MarianTokenizer
          M='Helsinki-NLP/opus-mt-en-ru'; tok=MarianTokenizer.from_pretrained(M); model=MarianMTModel.from_pretrained(M)
          T=re.compile(r'(\{\{[^{}]+\}\}|#\$[A-Za-z0-9_]+#|\$[A-Za-z0-9_]+|@[A-Za-z0-9_.-]*|\[[^\[\]]+\]|%[^%]+%|#)'); LAT=re.compile(r'[A-Za-z]{2,}')
          fixes={'Ridgeside Village':'деревня Риджсайд','Winter Star':'Зимняя звезда','Feast of the Winter Star':'Праздник Зимней звезды','Pelican Town':'Пеликан Таун','Stardew Valley':'Долина Стардью','Yoba':'Йоба','Junimo':'Джунимо','Krobus':'Кробус','Shane':'Шейн','Marnie':'Марни','Jas':'Джас','Pierre':'Пьер','Emily':'Эмили','Abigail':'Эбигейл','Alex':'Алекс','Caroline':'Кэролайн','Clint':'Клинт','Demetrius':'Деметриус','Elliott':'Эллиот','Evelyn':'Эвелин','George':'Джордж','Gus':'Гас','Haley':'Хейли','Harvey':'Харви','Jodi':'Джоди','Kent':'Кент','Lewis':'Льюис','Maru':'Мару','Penny':'Пенни','Robin':'Робин','Sam':'Сэм','Sebastian':'Себастьян','Vincent':'Винсент','Willy':'Вилли','Leah':'Лия','Pam':'Пэм','Linus':'Линус','Wizard':'Волшебник','Morris':'Моррис','Sandy':'Сэнди','Leo':'Лео'}
          trm={'a':'а','b':'б','c':'к','d':'д','e':'е','f':'ф','g':'г','h':'х','i':'и','j':'дж','k':'к','l':'л','m':'м','n':'н','o':'о','p':'п','q':'к','r':'р','s':'с','t':'т','u':'у','v':'в','w':'в','x':'кс','y':'й','z':'з'}
          def translit(w):
            r=''.join(trm.get(c.lower(),c) for c in w); return r.capitalize() if w[:1].isupper() else r
          def load(p): return json5.loads(p.read_text('utf-8-sig'))
          specs={'maggs':'Maggs Townsfolk Daily Dialogue Expansion','clowning':'Ultimate Guide To Clowning','uws_rsv':'Unique Winter Star - Ridgeside Village'}
          docs=[]; segments=[]; seen=set()
          def add_segment(s):
            if s and LAT.search(s) and s not in seen: seen.add(s); segments.append(s)
          for label,name in specs.items():
            root=pathlib.Path('extracted')/label; files=list(root.glob('**/i18n/default.json'))
            if not files: raise SystemExit('missing i18n '+label)
            for p in files:
              obj=load(p); docs.append((label,name,root,p,obj))
              for v in obj.values():
                if isinstance(v,str):
                  for x in T.split(v):
                    if x and not T.fullmatch(x): add_segment(x.strip())
          # Expand only very long segments; keep source-to-pieces map.
          source_pieces={}; pieces=[]
          for s in segments:
            if len(tok(s,add_special_tokens=True).input_ids)<=430: ps=[s]
            else:
              ps=[]; cur=[]
              for w in s.split():
                cand=' '.join(cur+[w])
                if cur and len(tok(cand,add_special_tokens=True).input_ids)>400: ps.append(' '.join(cur)); cur=[w]
                else: cur.append(w)
              if cur: ps.append(' '.join(cur))
            source_pieces[s]=ps; pieces.extend(ps)
          trans_piece={}
          for i in range(0,len(pieces),16):
            bt=pieces[i:i+16]; enc=tok(bt,return_tensors='pt',padding=True,truncation=False)
            gen=model.generate(**enc,max_new_tokens=512,num_beams=4); dec=tok.batch_decode(gen,skip_special_tokens=True)
            for a,b in zip(bt,dec): trans_piece[a]=b
            print('translated',min(i+16,len(pieces)),'/',len(pieces),flush=True)
          cache={}
          for s,ps in source_pieces.items():
            r=' '.join(trans_piece[p] for p in ps)
            for a,b in fixes.items(): r=re.sub(rf'\b{re.escape(a)}\b',b,r,flags=re.I)
            r=LAT.sub(lambda m: translit(m.group(0)),r); cache[s]=r
          def tr(v):
            out=[]
            for x in T.split(v):
              if not x: continue
              if T.fullmatch(x): out.append(x); continue
              m=re.match(r'^(\s*)(.*?)(\s*)$',x,flags=re.S); a,b,c=m.groups(); out.append(a+cache.get(b,b)+c)
            return ''.join(out)
          report=[]
          for label,name,root,p,obj in docs:
            ru={k:(tr(v) if isinstance(v,str) else v) for k,v in obj.items()}; rel=p.relative_to(root)
            dst=pathlib.Path('out')/label/rel.parent/'ru.json'; dst.parent.mkdir(parents=True,exist_ok=True); dst.write_text(json.dumps(ru,ensure_ascii=False,indent=2)+'\n','utf-8')
            mism=[k for k,v in obj.items() if isinstance(v,str) and T.findall(v)!=T.findall(ru[k])]
            residual=[k for k,v in ru.items() if isinstance(v,str) and LAT.search(T.sub('',v))]
            report.append({'label':label,'name':name,'src':str(rel),'keys':len(obj),'missing':len(set(obj)-set(ru)),'extra':len(set(ru)-set(obj)),'tokenMismatch':len(mism),'residualLatin':len(residual),'mismatchKeys':mism[:100],'residualKeys':residual[:100]})
          pathlib.Path('out/TRANSLATION_REPORT.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),'utf-8'); print(json.dumps(report,ensure_ascii=False),flush=True)
          PY
          python translate.py
      - name: Upload translated overlays
        uses: actions/upload-artifact@v4
        with:
          name: final3-russian-overlays
          path: out/
          retention-days: 1
          compression-level: 6
