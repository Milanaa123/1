name: Build SVG contours for animals 46-65
on:
  push:
    branches: [animagia-vector-batch09-20261028]
    paths:
      - 'tools/vectorize_gold_batch09.py'
      - '.github/workflows/animagia-vector-batch09-build.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: animagia-vector-batch09-build
  cancel-in-progress: true
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SVG contour tracer and image verifier
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 opencv-python-headless==4.11.0.86 CairoSVG==2.7.1
      - name: Build and verify gold SVGs 46-65 against individually approved source cells
        run: python tools/vectorize_gold_batch09.py
      - name: Save original versus SVG contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: animagia-vector09-46-65-original-vs-svg
          path: qa-artifacts/vector09-original-vs-svg.png
          retention-days: 14
      - name: Commit verified vector geometry and checksum manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add art/vector-ink/
          git diff --cached --quiet && exit 0
          git commit -m 'Trace 20 gold animals 46 to 65 into transparent SVG contours'
          git fetch origin animagia-vector-batch09-20261028
          git rebase origin/animagia-vector-batch09-20261028
          git push origin HEAD:animagia-vector-batch09-20261028
