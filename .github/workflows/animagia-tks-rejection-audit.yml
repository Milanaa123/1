name: Animagia TKS missing-Russian-name opportunity audit
on:
  push:
    branches: [animagia-site]
    paths:
      - tools/probe_tks_rejections.py
      - .github/workflows/animagia-tks-rejection-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/probe_tks_rejections.py
